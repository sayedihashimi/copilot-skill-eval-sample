name: .NET 11 Feature Adoption Evaluation
description: 'Evaluate how the dotnet-net11 skill improves Copilot''s ability to generate code that correctly uses new .NET
  11 APIs, C# language features, and framework capabilities instead of falling back to older patterns or third-party packages.

  '
scenarios:
- name: console-bcl
  prompt: prompts/scenarios/console-bcl.prompt.md
  description: 'Create a console developer toolkit app that exercises new BCL features including Zstandard compression, BFloat16,
    Rune-based text processing, HMAC verification, frozen collections, MIME type mapping, hard links, division rounding, JSON
    serialization improvements, Base64 parity, regex enhancements, anonymous pipes, union types, and collection expression
    arguments.

    '
- name: webapi
  prompt: prompts/scenarios/webapi.prompt.md
  description: 'Create a product catalog Web API that exercises new ASP.NET Core features including native OpenTelemetry tracing,
    OpenAPI 3.2, dynamic output cache policies, Zstandard response compression, and modern JSON serialization (PascalCase,
    per-member naming, type-level ignore, IReadOnlySet, generic GetTypeInfo).

    '
- name: blazor
  prompt: prompts/scenarios/blazor.prompt.md
  description: 'Create a Blazor task management app that exercises new Blazor components and navigation features including
    EnvironmentBoundary, Label, DisplayName, QuickGrid OnRowClick, relative-to-current-URI navigation, hash fragment URIs,
    TempData, BasePath, variable-height virtualization, and SignalR connection configuration.

    '
- name: efcore
  prompt: prompts/scenarios/efcore.prompt.md
  description: 'Create an EF Core order management demo that exercises new EF Core features including efficient state-based
    change tracking, clean DbContext replacement for testing, foreign key migration exclusion, and JSON column queries.

    '
configurations:
- name: no-skills
  label: Baseline (default Copilot)
  skills: []
  plugins: []
- name: dotnet-net11-skill
  label: dotnet-net11 Skill
  suggest_improvements: true
  skills: []
  plugins:
  - source: dotnet-net11
    path: dotnet-net11
verification:
  build:
    command: dotnet build
  run:
    command: dotnet run
    timeout_seconds: 15
dimensions:
- name: Zstandard Compression Usage
  description: Whether built-in Zstandard compression is used instead of third-party packages
  what_to_look_for: 'CORRECT: ZstandardStream, ZstandardCompressionOptions, ZstandardEncoder/Decoder, DecompressionMethods.Zstandard.
    INCORRECT: ZstdSharp or separate NuGet.'
  why_it_matters: Third-party packages signal missing .NET 11 knowledge.
  tier: critical
- name: BFloat16 Type Usage
  description: Whether the native BFloat16 type is used for ML-friendly float operations
  what_to_look_for: 'CORRECT: System.Numerics.BFloat16, BinaryPrimitives.WriteBFloat16LittleEndian, BitConverter.BFloat16ToInt16Bits.
    INCORRECT: Manual bit manipulation.'
  why_it_matters: Shows awareness of new .NET 11 numeric type additions.
  tier: high
- name: Rune-Based String Operations
  description: Whether Rune-based APIs are used for Unicode text processing
  what_to_look_for: 'CORRECT: string.Contains/IndexOf/Replace/Split(Rune), StringBuilder Rune methods, RunePosition.EnumerateUtf16,
    char.Equals with StringComparison. INCORRECT: char.ConvertFromUtf32, manual surrogates.'
  why_it_matters: Manual surrogate handling signals missing Rune API knowledge.
  tier: high
- name: HMAC Single-Step Verification
  description: Whether single-step HMAC verification is used instead of the two-step pattern
  what_to_look_for: 'CORRECT: HMACSHA256.Verify, CryptographicOperations.VerifyHmac, Kmac128/256.Verify. INCORRECT: HashData
    + FixedTimeEquals two-step.'
  why_it_matters: Two-step pattern is error-prone; single-step is safer.
  tier: high
- name: FrozenDictionary Collection Expressions
  description: Whether FrozenDictionary is created using collection expression syntax
  what_to_look_for: 'CORRECT: FrozenDictionary<K,V> lookup = ["key":val]; with comparer via with(). INCORRECT: Dictionary
    + ToFrozenDictionary().'
  why_it_matters: Old multi-step approach signals missing .NET 11 awareness.
  tier: high
- name: Collection Expression with() Arguments
  description: Whether the C# 15 with() syntax is used in collection expressions
  what_to_look_for: 'CORRECT: [with(capacity: n), .. values] inline. INCORRECT: Separate constructor + AddRange.'
  why_it_matters: Demonstrates C# 15 collection expression awareness.
  tier: high
- name: Union Type Usage
  description: Whether discriminated union types are defined using the union keyword
  what_to_look_for: 'CORRECT: union keyword, exhaustive switch, no default. May need polyfill. INCORRECT: abstract class hierarchy
    or OneOf NuGet.'
  why_it_matters: Class hierarchies signal missing C# 15 union support knowledge.
  tier: critical
- name: MediaTypeMap Usage
  description: Whether built-in MIME type mapping is used instead of manual dictionaries
  what_to_look_for: 'CORRECT: MediaTypeMap.GetMediaType/GetExtension. INCORRECT: Manual Dictionary or third-party.'
  why_it_matters: Eliminates manual MIME mappings or third-party packages.
  tier: medium
- name: DivisionRounding Modes
  description: Whether built-in division rounding modes are used instead of manual implementations
  what_to_look_for: 'CORRECT: int.Divide/Remainder/DivRem with DivisionRounding enum. INCORRECT: Manual implementations.'
  why_it_matters: Manual rounding is error-prone; built-in API is correct.
  tier: medium
- name: System.Text.Json New Features
  description: Whether new JSON serialization features are used correctly
  what_to_look_for: 'CORRECT: JsonNamingPolicy.PascalCase, [JsonNamingPolicy] per-property, type-level [JsonIgnore], IReadOnlySet<T>,
    GetTypeInfo<T>(). INCORRECT: Custom policy, per-property ignore, ISet workaround, cast.'
  why_it_matters: Workarounds signal missing .NET 11 JSON knowledge.
  tier: critical
- name: RegexOptions.AnyNewLine
  description: Whether the AnyNewLine regex option is used for Unicode newline handling
  what_to_look_for: 'CORRECT: RegexOptions.AnyNewLine for Unicode newlines. INCORRECT: Only Multiline or manual preprocessing.'
  why_it_matters: Missing AnyNewLine for mixed-newline text signals missing awareness.
  tier: medium
- name: File System New APIs
  description: Whether new file system APIs are used (hard links, null handle, anonymous pipes)
  what_to_look_for: 'CORRECT: File.CreateHardLink, File.OpenNullHandle, SafeFileHandle.CreateAnonymousPipe, RandomAccess on
    pipes. INCORRECT: P/Invoke, platform-conditional paths.'
  why_it_matters: Clean cross-platform APIs replace P/Invoke workarounds.
  tier: high
- name: Base64 Parity APIs
  description: Whether new Base64 convenience methods are used
  what_to_look_for: 'CORRECT: Base64.EncodeToString/DecodeFromChars/GetEncodedLength. INCORRECT: Convert.ToBase64String.'
  why_it_matters: New APIs are more convenient than Convert class methods.
  tier: medium
- name: Generic Interlocked Operations
  description: Whether generic Interlocked.And/Or are used directly with enum types
  what_to_look_for: 'CORRECT: Interlocked.Or/And directly on enum. INCORRECT: Cast to int and back.'
  why_it_matters: Eliminates error-prone casting to int and back.
  tier: medium
- name: BitArray.PopCount
  description: Whether the built-in PopCount method is used instead of manual counting
  what_to_look_for: 'CORRECT: bits.PopCount(). INCORRECT: Manual foreach loop.'
  why_it_matters: Manual counting signals missing PopCount knowledge.
  tier: low
- name: Native OpenTelemetry Tracing
  description: Whether ASP.NET Core's built-in tracing is used without external instrumentation packages
  what_to_look_for: 'CORRECT: AddSource("Microsoft.AspNetCore"). INCORRECT: External instrumentation NuGet.'
  why_it_matters: Eliminates external instrumentation package dependency.
  tier: high
- name: OpenAPI Version
  description: Whether OpenAPI 3.2.0 is used
  what_to_look_for: 'CORRECT: OpenApiSpecVersion.OpenApi3_2. INCORRECT: Default or 3_1.'
  why_it_matters: Using latest OpenAPI version demonstrates framework awareness.
  tier: medium
- name: Dynamic Output Cache Policy Provider
  description: Whether output cache policies are resolved dynamically via a provider interface
  what_to_look_for: 'CORRECT: IOutputCachePolicyProvider + DI. INCORRECT: Static AddPolicy.'
  why_it_matters: Enables per-tenant and config-driven cache policies.
  tier: high
- name: Zstandard Response Compression
  description: Whether Zstandard is enabled for ASP.NET Core response and request compression
  what_to_look_for: 'CORRECT: AddResponseCompression (Zstd default), Configure<ZstandardCompressionProviderOptions>. INCORRECT:
    Only Brotli/Gzip.'
  why_it_matters: Built-in by default in .NET 11.
  tier: high
- name: Blazor EnvironmentBoundary Component
  description: Whether the declarative EnvironmentBoundary component is used instead of manual checks
  what_to_look_for: 'CORRECT: <EnvironmentBoundary Include/Exclude>. INCORRECT: @inject IHostEnvironment + manual if.'
  why_it_matters: Replaces boilerplate environment checking code.
  tier: high
- name: Blazor Label and DisplayName Components
  description: Whether the new Label and DisplayName components are used for forms and tables
  what_to_look_for: 'CORRECT: <Label For>, <DisplayName For>, auto-reads attributes. INCORRECT: Manual <label> with hardcoded
    text.'
  why_it_matters: Brings MVC label/display-name parity to Blazor.
  tier: high
- name: QuickGrid OnRowClick
  description: Whether QuickGrid row click uses the built-in event rather than a button column workaround
  what_to_look_for: 'CORRECT: OnRowClick parameter. INCORRECT: Button column workaround.'
  why_it_matters: Replaces button column workarounds.
  tier: high
- name: RelativeToCurrentUri Navigation
  description: Whether relative-to-current-URI navigation is used instead of base-relative
  what_to_look_for: 'CORRECT: NavigationOptions.RelativeToCurrentUri, NavLink, GetUriWithHash. INCORRECT: Manual URI construction.'
  why_it_matters: Replaces manual URI construction.
  tier: medium
- name: Blazor TempData Support
  description: Whether TempData is used for cross-page flash messages
  what_to_look_for: 'CORRECT: [CascadingParameter] ITempData with Get/Peek/Keep. INCORRECT: Manual cookie flash.'
  why_it_matters: Brings Blazor SSR to parity with MVC flash messaging.
  tier: high
- name: Blazor BasePath Component
  description: Whether the BasePath component is used instead of hardcoded base href
  what_to_look_for: 'CORRECT: <BasePath />. INCORRECT: Hardcoded <base href>.'
  why_it_matters: Auto-resolves base path for subpath hosting.
  tier: medium
- name: EF Core GetEntriesForState
  description: Whether efficient state-based entity querying is used
  what_to_look_for: 'CORRECT: GetEntriesForState (skips DetectChanges). INCORRECT: Entries().Where (forces DetectChanges).'
  why_it_matters: Avoids DetectChanges overhead in long-lived contexts.
  tier: high
- name: EF Core RemoveDbContext
  description: Whether clean DbContext replacement uses the removal API
  what_to_look_for: 'CORRECT: RemoveDbContext<T>() + re-register, parameterless AddPooledDbContextFactory. INCORRECT: Conflicting
    registrations.'
  why_it_matters: Clean removal designed for test scenarios.
  tier: high
- name: EF Core ExcludeForeignKeyFromMigrations
  description: Whether the FK migration exclusion API is used
  what_to_look_for: 'CORRECT: .ExcludeForeignKeyFromMigrations(true). INCORRECT: Manual migration editing.'
  why_it_matters: For legacy schema / application-enforced FK scenarios.
  tier: medium
- name: EF Core JSON Query Functions
  description: Whether built-in JSON query functions are used for JSON column queries
  what_to_look_for: 'CORRECT: EF.Functions.JsonContains/JsonPathExists. INCORRECT: FromSqlRaw or LIKE only.'
  why_it_matters: Type-safe JSON functions composable with LINQ.
  tier: high
- name: SignalR ConfigureConnection
  description: Whether SignalR connection options are configured for interactive server components
  what_to_look_for: 'CORRECT: ConfigureConnection callback on AddInteractiveServerRenderMode. INCORRECT: No clean access.'
  why_it_matters: Clean access to SignalR dispatcher options.
  tier: medium
- name: Blazor Virtualize Variable-Height Items
  description: Whether virtualization handles variable-height items correctly
  what_to_look_for: 'CORRECT: <Virtualize> adapts to variable heights, OverscanCount=15. INCORRECT: Fixed heights.'
  why_it_matters: Adapts to actual rendered item heights at runtime.
  tier: medium
- name: Runtime Async Configuration
  description: Whether runtime async is enabled correctly without unnecessary preview flags
  what_to_look_for: 'CORRECT: <Features>runtime-async=on</Features> only. INCORRECT: Also EnablePreviewFeatures.'
  why_it_matters: No longer requires preview opt-in.
  tier: medium
- name: ProcessExitStatus Usage
  description: Whether rich process exit information is accessed via the new status type
  what_to_look_for: 'CORRECT: process.ExitStatus (ExitCode, Canceled, Signal). INCORRECT: Only ExitCode int.'
  why_it_matters: Structured exit info replaces manual exit code decoding.
  tier: medium
- name: OpenAPI Binary File Response
  description: Whether binary file download endpoints are properly described in OpenAPI
  what_to_look_for: 'CORRECT: .Produces<FileContentResult>(contentType: Octet). INCORRECT: No Produces metadata.'
  why_it_matters: Proper binary response improves API documentation.
  tier: medium
- name: Brotli and Compression Options
  description: Whether new compression option properties are used
  what_to_look_for: 'CORRECT: BrotliCompressionOptions.WindowLog (new). INCORRECT: Only Quality.'
  why_it_matters: Finer-grained compression control.
  tier: low
- name: Vector Constants
  description: Whether SIMD vector mathematical constants are used
  what_to_look_for: 'CORRECT: Vector<float>.Pi/E/Tau/Epsilon/NaN etc. INCORRECT: Manual Vector.Create.'
  why_it_matters: More readable and potentially JIT-optimized.
  tier: low
- name: Overall .NET 11 API Adoption Rate
  description: What fraction of available .NET 11 features are correctly used vs. old patterns
  what_to_look_for: Count features correctly used vs old patterns. Consider count and correctness.
  why_it_matters: Primary metric for skill effectiveness.
  tier: critical
output:
  directory: output
  reports_directory: reports
  analysis_file: analysis.md
  notes_file: build-notes.md
